name: "Assert Tag"
description: "Reads a version from a TOML file and fails if the corresponding git tag already exists"
branding:
  icon: "tag"
  color: "blue"

inputs:
  file:
    description: "Path to the TOML file"
    required: false
    default: "Project.toml"
  field:
    description: "Field in the TOML file to read"
    required: false
    default: "version"
  prefix:
    description: "Prefix prepended to the version to form the tag"
    required: false
    default: "v"

outputs:
  version:
    description: "Version value read from the TOML file"
    value: ${{ steps.toml.outputs.value }}
  tag:
    description: "Full tag name (prefix + version)"
    value: ${{ steps.compose.outputs.tag }}

runs:
  using: "composite"
  steps:
    - uses: SebRollen/toml-action@v1.2.0
      id: toml
      with:
        file: ${{ inputs.file }}
        field: ${{ inputs.field }}

    - id: compose
      shell: bash
      run: echo "tag=${{ inputs.prefix }}${{ steps.toml.outputs.value }}" >> "$GITHUB_OUTPUT"

    - uses: mukunku/tag-exists-action@v1.6.0
      id: check
      with:
        tag: ${{ steps.compose.outputs.tag }}

    - if: steps.check.outputs.exists == 'true'
      shell: bash
      run: |
        echo "::error::Tag ${{ steps.compose.outputs.tag }} already exists. Bump '${{ inputs.field }}' in ${{ inputs.file }}."
        exit 1
